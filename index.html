<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Earnings & Rate Calculator</title>
    <style>
        :root {
            --primary-upwork: #14a800;
            --primary-fiverr: #1dbf73;
            --bg-color: #0f172a;
            --surface-bg: #1e293b;
            --card-bg: #303e5a;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1; /* লেখার কালার আরেকটু সাদা ও রিডেবল করা হয়েছে */
            --border-color: #475569;
            --accent-yellow: #f59e0b;
        }

        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            min-height: 650px;
            border-radius: 0px;
            padding: 0px;
            border: none;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            overflow: hidden;
            background: var(--surface-bg);
        }

        /* Sidebar Styling */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgb(54 69 105 / 40%);
            padding: 20px;
            border-radius: 0px;
            border: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .app-header {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .platform-tabs {
            display: flex;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 10px;
            border: none;
            background: transparent;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn.active.upwork { background: var(--primary-upwork); color: #fff; }
        .tab-btn.active.fiverr { background: var(--primary-fiverr); color: #fff; }

        .toggle-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-color);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .toggle-box.disabled-box {
            cursor: not-allowed;
            opacity: 0.5;
            background: rgba(15, 23, 42, 0.4);
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .toggle-label { font-size: 13px; font-weight: 600; color: var(--text-main); pointer-events: none; }
        .toggle-hint { font-size: 11px; color: var(--primary-fiverr); font-weight: 500; line-height: 1.3; pointer-events: none; }

        .switch { position: relative; display: inline-block; width: 38px; height: 18px; flex-shrink: 0; pointer-events: none; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #64748b; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-upwork); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Inline 2-Column Grid for Inputs */
        .input-inline-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: var(--surface-bg);
            color: #fff;
            transition: all 0.2s ease;
        }
        
        input:focus { border-color: var(--primary-upwork); }

        input:disabled {
            background: rgba(15, 23, 42, 0.6);
            color: #475569;
            border-color: #334155;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .input-group.disabled-group label {
            color: #475569;
        }

        /* Workspace Styling */
        .workspace {
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding-right: 15px;
            padding-top: 20px;
            padding-bottom: 20px;
            padding-left: 10px;
        }

        .breakdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding-right: 16px;
        }

        .card {
            background: #303e5a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .breakdown-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
        }

        /* টোটাল এবং টেক-হোম বাদ দিয়ে শুধু উপরের আইটেমগুলোর নিচে বর্ডার দেওয়া হয়েছে */
        .breakdown-item{ 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: var(--text-muted); 
            padding-bottom: 6px;
        }
      .breakdown-item:not(:last-child) {

    border-bottom: 1px solid #ddd;
}

        .breakdown-item strong { color: #fff; }
        
        .breakdown-item.highlight {
            border-top: 1px dashed #fff;
            border-bottom: none; /* টোটাল এর নিচে কোনো বর্ডার থাকবে না */
            padding-top: 8px;
            padding-bottom: 0px;
            margin-top: 4px;
            font-size: 14px;
            color: #fff;
            font-weight: 700;
        }

        /* Message Box */
        .msg-section {
            background: transparent;
            border: none;
            border-radius: 10px;
            padding: 0px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-btn {
            padding: 6px 12px;
            background: var(--primary-upwork);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .copy-btn:hover { opacity: 0.9; }

        .editable-msg {
            width: 100%;
            height: 330px;
            min-height: 120px;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgb(32 42 69);
            color: #f1f5f9;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            line-height: 1.5;
            outline: none;
            resize: none;
        }

        /* Toast Alert */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #f8fafc;
            color: #0f172a;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        @media (max-width: 820px) {
            .dashboard-container { 
                grid-template-columns: 1fr; 
                height: auto; 
                min-height: 100vh;
                overflow-y: auto;
            }
            .sidebar { border-right: none; border-bottom: 1px solid var(--border-color); }
            .workspace { padding: 16px; }
            .breakdown-grid { grid-template-columns: 1fr; padding-right: 0; }
            .msg-section { padding: 0; }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
        <div class="app-header">⚡ Freelance Calc Studio</div>

        <!-- Platform Tabs -->
        <div class="platform-tabs">
            <button class="tab-btn active upwork" id="upworkTab" onclick="switchPlatform('upwork')">Upwork</button>
            <button class="tab-btn fiverr" id="fiverrTab" onclick="switchPlatform('fiverr')">Fiverr</button>
        </div>

        <!-- Hourly / Fixed Toggle -->
        <div class="toggle-box" id="typeToggleBox" onclick="triggerTypeToggle()">
            <div class="toggle-row">
                <span class="toggle-label" id="toggleLabelText">Hourly Job</span>
                <label class="switch">
                    <input type="checkbox" id="jobTypeToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Fee Mode Toggle -->
        <div class="toggle-box" id="feeModeToggleBox" onclick="triggerModeToggle()">
            <div class="toggle-row">
                <span class="toggle-label" id="modeLabelText">Included Fee</span>
                <label class="switch">
                    <input type="checkbox" id="modeToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="toggle-hint" id="modeHintText">💡 Client will not pay fee</div>
        </div>

        <!-- Inline Inputs Group -->
        <div class="input-inline-grid">
            <div class="input-group" id="rateInputGroup">
                <label id="rateLabel">Hourly Rate ($)</label>
                <input type="number" id="hourlyRate" value="15" step="0.5" oninput="saveAndCalculate()">
            </div>

            <div class="input-group">
                <label id="budgetLabel">Client Budget ($)</label>
                <input type="number" id="totalBudget" value="120" step="1" oninput="saveAndCalculate()">
            </div>
        </div>
    </div>

    <!-- RIGHT WORKSPACE PANEL -->
    <div class="workspace">
        
        <!-- TOP: BREAKDOWNS -->
        <div class="breakdown-grid">
            
            <!-- Client Expense -->
            <div class="card">
                <div class="card-header">Client Cost Breakdown</div>
                <div class="breakdown-list" id="clientBreakdownList"></div>
            </div>

            <!-- Freelancer Take-Home -->
            <div class="card" id="takeHomeCard">
                <div class="card-header" id="earningsHeader">Net Take-Home</div>
                <div class="breakdown-list" id="freelancerBreakdownList"></div>
            </div>

        </div>

        <!-- BOTTOM: EDITABLE CLIENT MESSAGE -->
        <div class="msg-section">
            <div class="msg-header">
                <label>Client Proposal Message</label>
                <button class="copy-btn" id="copyBtn" onclick="copyClientMessage()">Copy Message</button>
            </div>
            <textarea id="clientMessageArea" class="editable-msg"></textarea>
        </div>

    </div>

</div>

<!-- Toast Alert -->
<div id="toast" class="toast">Message copied to clipboard!</div>

<script>
    let currentPlatform = 'upwork';
    
    let platformModes = {
        upwork: true,
        fiverr: false
    };

    function saveSettings() {
        const settings = {
            platform: currentPlatform,
            platformModes: platformModes,
            jobTypeHourly: document.getElementById('jobTypeToggle').checked,
            hourlyRate: document.getElementById('hourlyRate').value,
            totalBudget: document.getElementById('totalBudget').value
        };
        localStorage.setItem('calc_studio_settings', JSON.stringify(settings));
    }

    function loadSettings() {
        const saved = localStorage.getItem('calc_studio_settings');
        if (saved) {
            try {
                const settings = JSON.parse(saved);
                currentPlatform = settings.platform || 'upwork';
                if(settings.platformModes) platformModes = settings.platformModes;
                document.getElementById('jobTypeToggle').checked = settings.jobTypeHourly !== undefined ? settings.jobTypeHourly : true;
                document.getElementById('hourlyRate').value = settings.hourlyRate || '15';
                document.getElementById('totalBudget').value = settings.totalBudget || '120';
            } catch(e) {
                console.error("Failed to parse settings", e);
            }
        }
        applyPlatformUI();
    }

    function switchPlatform(platform) {
        currentPlatform = platform;
        applyPlatformUI();
        saveAndCalculate();
    }

    function applyPlatformUI() {
        const isUpwork = currentPlatform === 'upwork';

        document.getElementById('upworkTab').className = `tab-btn ${isUpwork ? 'active upwork' : ''}`;
        document.getElementById('fiverrTab').className = `tab-btn ${!isUpwork ? 'active fiverr' : ''}`;
        
        const brandColor = isUpwork ? 'var(--primary-upwork)' : 'var(--primary-fiverr)';
        
        document.getElementById('copyBtn').style.background = brandColor;
        document.getElementById('earningsHeader').style.color = brandColor;
        document.getElementById('takeHomeCard').style.borderColor = isUpwork ? 'rgba(20, 168, 0, 0.4)' : 'rgba(29, 191, 115, 0.4)';

        const typeToggleBox = document.getElementById('typeToggleBox');
        const feeModeBox = document.getElementById('feeModeToggleBox');
        const modeToggle = document.getElementById('modeToggle');

        if(!isUpwork) {
            typeToggleBox.style.display = 'none';
            setHourlyRateDisabled(true);

            feeModeBox.classList.add('disabled-box');
            modeToggle.checked = false; 
            document.getElementById('modeLabelText').innerText = 'Standard Fee';
            document.getElementById('modeHintText').innerText = '💡 Client will pay fee (Default)';
            document.getElementById('modeHintText').style.color = 'var(--text-muted)';
        } else {
            typeToggleBox.style.display = 'flex';
            feeModeBox.classList.remove('disabled-box');
            modeToggle.checked = platformModes['upwork'];
            
            handleTypeToggleUI();
            handleModeToggleUI();
        }
    }

    function triggerTypeToggle() {
        if (currentPlatform !== 'upwork') return;
        const toggle = document.getElementById('jobTypeToggle');
        toggle.checked = !toggle.checked;
        handleTypeToggleUI();
        saveAndCalculate();
    }

    function handleTypeToggleUI() {
        const isHourly = document.getElementById('jobTypeToggle').checked;
        document.getElementById('toggleLabelText').innerText = isHourly ? 'Hourly Job' : 'Fixed Job';
        setHourlyRateDisabled(!isHourly);
    }

    function setHourlyRateDisabled(isDisabled) {
        const rateInput = document.getElementById('hourlyRate');
        const rateGroup = document.getElementById('rateInputGroup');
        rateInput.disabled = isDisabled;
        
        if (isDisabled) {
            rateGroup.classList.add('disabled-group');
        } else {
            rateGroup.classList.remove('disabled-group');
        }
    }

    function triggerModeToggle() {
        if (currentPlatform === 'fiverr') return;

        const toggle = document.getElementById('modeToggle');
        toggle.checked = !toggle.checked;
        platformModes['upwork'] = toggle.checked;
        handleModeToggleUI();
        saveAndCalculate();
    }

    function handleModeToggleUI() {
        if (currentPlatform === 'fiverr') return;

        const isIncluded = document.getElementById('modeToggle').checked;
        const modeLabel = document.getElementById('modeLabelText');
        const modeHint = document.getElementById('modeHintText');

        if (isIncluded) {
            modeLabel.innerText = 'Included Fee (Active)';
            modeHint.innerText = '💡 Client will not pay fee';
            modeHint.style.color = 'var(--primary-upwork)';
        } else {
            modeLabel.innerText = 'Excluded Fee (Active)';
            modeHint.innerText = '💡 Client will pay fee';
            modeHint.style.color = 'var(--accent-yellow)';
        }
    }

    function saveAndCalculate() {
        saveSettings();
        performCalculation();
    }

    function performCalculation() {
        const isHourly = document.getElementById('jobTypeToggle').checked && currentPlatform === 'upwork';
        const isIncluded = currentPlatform === 'upwork' ? document.getElementById('modeToggle').checked : false;
        const rate = parseFloat(document.getElementById('hourlyRate').value) || 0;
        const budget = parseFloat(document.getElementById('totalBudget').value) || 0;

        let workCost = 0, clientFees = 0, oneTimeFee = 0, grandTotal = 0;
        let hours = 0, minutes = 0;
        let freelancerFeeRate = currentPlatform === 'upwork' ? 0.10 : 0.20;

        if (currentPlatform === 'upwork') {
            oneTimeFee = 9.99;
            const hourlyFeeRate = 0.46;

            if (isHourly) {
                const hourlyTotal = rate + hourlyFeeRate;
                if (isIncluded) {
                    const remainingBudget = Math.max(0, budget - oneTimeFee);
                    const decimalHours = remainingBudget / hourlyTotal;
                    hours = Math.floor(decimalHours);
                    minutes = Math.floor((decimalHours - hours) * 60);

                    workCost = (hours + minutes/60) * rate;
                    clientFees = (hours + minutes/60) * hourlyFeeRate;
                    grandTotal = workCost + clientFees + oneTimeFee;
                } else {
                    hours = Math.floor(budget / rate);
                    minutes = Math.floor(((budget / rate) - hours) * 60);
                    workCost = budget;
                    clientFees = (hours + minutes/60) * hourlyFeeRate;
                    grandTotal = workCost + clientFees + oneTimeFee;
                }
            } else { 
                if (isIncluded) {
                    workCost = Math.max(0, (budget - oneTimeFee) / 1.05);
                    clientFees = workCost * 0.05;
                    grandTotal = budget;
                } else {
                    workCost = budget;
                    clientFees = workCost * 0.05;
                    grandTotal = workCost + clientFees + oneTimeFee;
                }
            }
        } else { 
            oneTimeFee = 0;
            workCost = budget;
            clientFees = (workCost * 0.055) + 2.50;
            grandTotal = workCost + clientFees;
        }

        const freelancerFee = workCost * freelancerFeeRate;
        const netEarnings = workCost - freelancerFee;

        // Proposal Message Text
        let msg = `Hi [Client's Name],\n\n`;
        if (isHourly) {
            msg += `To keep your total expense strictly within $${budget}, here is the breakdown for ${hours}h ${minutes}m of work:\n\n`;
            msg += `• Work Time: ${hours} Hours and ${minutes} Minutes\n`;
            msg += `• Work Cost ($${rate}/hr): $${workCost.toFixed(2)}\n`;
            msg += `• Upwork Fees & Taxes: $${clientFees.toFixed(2)}\n`;
            msg += `• One-Time Contract Fee: $${oneTimeFee}\n`;
            msg += `• Total Estimated Checkout: $${grandTotal.toFixed(2)}\n\n`;
            msg += isIncluded ? `This keeps your final bill safely within $${budget}.` : `Your total payment will be $${grandTotal.toFixed(2)}.`;
        } else {
            msg += `To set up our project offer, here is the breakdown:\n\n`;
            msg += `• Project Offer Price: $${workCost.toFixed(2)}\n`;
            msg += `• Estimated Platform Fees: $${clientFees.toFixed(2)}\n`;
            if(oneTimeFee > 0) msg += `• One-Time Contract Fee: $${oneTimeFee}\n`;
            msg += `• Total Out-of-Pocket Expense: $${grandTotal.toFixed(2)}\n\n`;
            msg += `Looking forward to starting!`;
        }

        document.getElementById('clientMessageArea').value = msg;

        // Client UI Output
        let clientHTML = '';
        if(isHourly) clientHTML += `<div class="breakdown-item"><span>Total Duration:</span> <strong>${hours}h ${minutes}m</strong></div>`;
        clientHTML += `<div class="breakdown-item"><span>Base Work Cost:</span> <strong>$${workCost.toFixed(2)}</strong></div>`;
        clientHTML += `<div class="breakdown-item"><span>Platform Fees:</span> <strong style="color: var(--accent-yellow);">$${clientFees.toFixed(2)}</strong></div>`;
        if(oneTimeFee > 0) clientHTML += `<div class="breakdown-item"><span>One-Time Fee:</span> <strong>$${oneTimeFee.toFixed(2)}</strong></div>`;
        clientHTML += `<div class="breakdown-item highlight"><span>Client Total:</span> <strong>$${grandTotal.toFixed(2)}</strong></div>`;
        document.getElementById('clientBreakdownList').innerHTML = clientHTML;

        // Freelancer UI Output
        let freeHTML = '';
        freeHTML += `<div class="breakdown-item"><span>Gross Earnings:</span> <strong>$${workCost.toFixed(2)}</strong></div>`;
        freeHTML += `<div class="breakdown-item"><span>Service Fee (${freelancerFeeRate*100}%):</span> <strong style="color: var(--accent-yellow);">-$${freelancerFee.toFixed(2)}</strong></div>`;
        freeHTML += `<div class="breakdown-item highlight"><span>Your Take-Home:</span> <strong style="color:${currentPlatform === 'upwork' ? 'var(--primary-upwork)' : 'var(--primary-fiverr)'};">$${netEarnings.toFixed(2)}</strong></div>`;
        document.getElementById('freelancerBreakdownList').innerHTML = freeHTML;
    }

    function copyClientMessage() {
        const textarea = document.getElementById('clientMessageArea');
        textarea.select();
        navigator.clipboard.writeText(textarea.value);

        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 2500);
    }

    window.onload = () => {
        loadSettings();
        performCalculation();
    };
</script>

</body>
</html>
