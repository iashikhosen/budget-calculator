<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Earnings & Rate Calculator</title>
    <style>
        :root {
            --primary-upwork: #14a800;
            --primary-fiverr: #1dbf73;
            --bg-color: #0f172a;
            --surface-bg: #1e293b;
            --card-bg: #303e5a;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --border-color: #475569;
            --accent-yellow: #f59e0b;
        }

        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            min-height: 650px;
            border-radius: 0px;
            padding: 0px;
            border: none;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            overflow: hidden;
            background: var(--surface-bg);
        }

        /* Sidebar Styling */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgb(54 69 105 / 40%);
            padding: 20px;
            border-radius: 0px;
            border: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .app-header {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .platform-tabs {
            display: flex;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 10px;
            border: none;
            background: transparent;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn.active.upwork { background: var(--primary-upwork); color: #fff; }
        .tab-btn.active.fiverr { background: var(--primary-fiverr); color: #fff; }

        .toggle-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-color);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .toggle-box.disabled-box {
            cursor: not-allowed;
            opacity: 0.5;
            background: rgba(15, 23, 42, 0.4);
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .toggle-label { font-size: 13px; font-weight: 600; color: var(--text-main); pointer-events: none; }
        .toggle-hint { font-size: 11px; color: var(--primary-fiverr); font-weight: 500; line-height: 1.3; pointer-events: none; }

        .switch { position: relative; display: inline-block; width: 38px; height: 18px; flex-shrink: 0; pointer-events: none; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #64748b; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-upwork); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Inline 2-Column Grid for Inputs */
        .input-inline-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: var(--surface-bg);
            color: #fff;
            transition: all 0.2s ease;
        }
        
        input:focus { border-color: var(--primary-upwork); }

        input:disabled {
            background: rgba(15, 23, 42, 0.6);
            color: #475569;
            border-color: #334155;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Computed / read-only output field */
        input[readonly] {
            background: rgba(15, 23, 42, 0.7);
            color: var(--accent-yellow);
            font-weight: 700;
            border-color: #334155;
            cursor: default;
        }
        input[readonly]:focus { border-color: #334155; }

        .input-group.disabled-group label { color: #475569; }
        .input-group.computed-group label { color: var(--accent-yellow); }

        /* Workspace Styling */
        .workspace {
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding-right: 15px;
            padding-top: 20px;
            padding-bottom: 20px;
            padding-left: 10px;
        }

        .breakdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding-right: 16px;
        }

        .card {
            background: #303e5a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .card-header {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .breakdown-list {
            display: flex;
            flex-direction: column;
            gap: 8px; /* Balanced spacing */
            font-size: 14px;
        }

        /* Clean item styling - NO BORDERS */
        .breakdown-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: var(--text-muted); 
            padding: 4px 0;
        }

        .breakdown-item strong { 
            color: #fff; 
            font-weight: 600;
        }
        
        /* Highlight for base work cost - subtle blue background */
        .breakdown-item.workcost-highlight {
            background: rgba(56, 189, 248, 0.15); /* 15% opacity of sky-blue */
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 4px;
        }
        .breakdown-item.workcost-highlight span {
            color: #f8fafc; /* Brighter label text */
            font-weight: 600;
        }
        .breakdown-item.workcost-highlight strong {
            color: #fff;
            font-weight: 700;
        }

        /* Highlight for total fees - subtle yellow background */
        .breakdown-item.fees-highlight {
            background: rgba(245, 158, 11, 0.15); /* 15% opacity of accent-yellow */
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 4px;
        }
        .breakdown-item.fees-highlight span {
            color: #f8fafc; /* Brighter label text */
            font-weight: 600;
        }

        /* Highlight for final total - stronger background */
        .breakdown-item.highlight {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 12px;
            border-radius: 6px;
            margin-top: 4px;
            font-size: 15px;
            color: #fff;
            font-weight: 700;
        }

        /* Center the take-home list vertically to avoid empty gap */
        #takeHomeCard .breakdown-list {
            flex: 1;
            justify-content: center;
        }

        /* Message Box */
        .msg-section {
            background: transparent;
            border: none;
            border-radius: 10px;
            padding: 0px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-btn {
            padding: 6px 12px;
            background: var(--primary-upwork);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .copy-btn:hover { opacity: 0.9; }

        .editable-msg {
            width: 100%;
            height: 330px;
            min-height: 120px;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgb(32 42 69);
            color: #f1f5f9;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            line-height: 1.5;
            outline: none;
            resize: none;
        }

        /* Toast Alert */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #f8fafc;
            color: #0f172a;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        @media (max-width: 820px) {
            .dashboard-container { 
                grid-template-columns: 1fr; 
                height: auto; 
                min-height: 100vh;
                overflow-y: auto;
            }
            .sidebar { border-right: none; border-bottom: 1px solid var(--border-color); }
            .workspace { padding: 16px; }
            .breakdown-grid { grid-template-columns: 1fr; padding-right: 0; }
            .msg-section { padding: 0; }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
        <div class="app-header">⚡ Freelance Calc Studio</div>

        <!-- Platform Tabs -->
        <div class="platform-tabs">
            <button class="tab-btn active upwork" id="upworkTab" onclick="switchPlatform('upwork')">Upwork</button>
            <button class="tab-btn fiverr" id="fiverrTab" onclick="switchPlatform('fiverr')">Fiverr</button>
        </div>

        <!-- Hourly / Fixed Toggle -->
        <div class="toggle-box" id="typeToggleBox" onclick="triggerTypeToggle()">
            <div class="toggle-row">
                <span class="toggle-label" id="toggleLabelText">Hourly Job</span>
                <label class="switch">
                    <input type="checkbox" id="jobTypeToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Calculation Basis Toggle (Upwork + Hourly only) -->
        <div class="toggle-box" id="calcBasisToggleBox" onclick="triggerBasisToggle()">
            <div class="toggle-row">
                <span class="toggle-label" id="basisLabelText">By Client Budget</span>
                <label class="switch">
                    <input type="checkbox" id="basisToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="toggle-hint" id="basisHintText">💡 Enter budget → get hours</div>
        </div>

        <!-- Fee Mode Toggle -->
        <div class="toggle-box" id="feeModeToggleBox" onclick="triggerModeToggle()">
            <div class="toggle-row">
                <span class="toggle-label" id="modeLabelText">Included Fee</span>
                <label class="switch">
                    <input type="checkbox" id="modeToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="toggle-hint" id="modeHintText">💡 Client will not pay fee</div>
        </div>

        <!-- Inline Inputs Group -->
        <div class="input-inline-grid">
            <div class="input-group" id="rateInputGroup">
                <label id="rateLabel">Hourly Rate ($)</label>
                <input type="number" id="hourlyRate" value="15" step="0.5" oninput="saveAndCalculate()">
            </div>

            <div class="input-group" id="hoursInputGroup" style="display:none;">
                <label>Hours</label>
                <input type="number" id="workHours" value="10" step="1" min="0" oninput="saveAndCalculate()">
            </div>

            <div class="input-group" id="minutesInputGroup" style="display:none;">
                <label>Minutes</label>
                <input type="number" id="workMinutes" value="0" step="5" min="0" max="59" oninput="saveAndCalculate()">
            </div>

            <div class="input-group" id="budgetInputGroup">
                <label id="budgetLabel">Client Budget ($)</label>
                <input type="number" id="totalBudget" value="120" step="1" oninput="saveAndCalculate()">
            </div>
        </div>
    </div>

    <!-- RIGHT WORKSPACE PANEL -->
    <div class="workspace">
        
        <!-- TOP: BREAKDOWNS -->
        <div class="breakdown-grid">
            
            <!-- Client Expense -->
            <div class="card">
                <div class="card-header">Client Cost Breakdown</div>
                <div class="breakdown-list" id="clientBreakdownList"></div>
            </div>

            <!-- Freelancer Take-Home -->
            <div class="card" id="takeHomeCard">
                <div class="card-header" id="earningsHeader">Net Take-Home</div>
                <div class="breakdown-list" id="freelancerBreakdownList"></div>
            </div>

        </div>

        <!-- BOTTOM: EDITABLE CLIENT MESSAGE -->
        <div class="msg-section">
            <div class="msg-header">
                <label>Client Proposal Message</label>
                <button class="copy-btn" id="copyBtn" onclick="copyClientMessage()">Copy Message</button>
            </div>
            <textarea id="clientMessageArea" class="editable-msg"></textarea>
        </div>

    </div>

</div>

<!-- Toast Alert -->
<div id="toast" class="toast">Message copied to clipboard!</div>

<script>
    let currentPlatform = 'upwork';

    let platformModes = {
        upwork: true,
        fiverr: false
    };

    /* ---------------- Persistence ---------------- */

    function saveSettings() {
        const settings = {
            platform: currentPlatform,
            platformModes: platformModes,
            jobTypeHourly: document.getElementById('jobTypeToggle').checked,
            basisByHours: !document.getElementById('basisToggle').checked,
            hourlyRate: document.getElementById('hourlyRate').value,
            totalBudget: document.getElementById('totalBudget').value,
            workHours: document.getElementById('workHours').value,
            workMinutes: document.getElementById('workMinutes').value
        };
        localStorage.setItem('calc_studio_settings', JSON.stringify(settings));
    }

    function loadSettings() {
        const saved = localStorage.getItem('calc_studio_settings');
        if (saved) {
            try {
                const settings = JSON.parse(saved);
                currentPlatform = settings.platform || 'upwork';
                if (settings.platformModes) platformModes = settings.platformModes;

                document.getElementById('jobTypeToggle').checked =
                    settings.jobTypeHourly !== undefined ? settings.jobTypeHourly : true;
                document.getElementById('basisToggle').checked = settings.basisByHours ? false : true;
                document.getElementById('hourlyRate').value = settings.hourlyRate || '15';
                document.getElementById('totalBudget').value = settings.totalBudget || '120';
                document.getElementById('workHours').value =
                    (settings.workHours !== undefined && settings.workHours !== '') ? settings.workHours : '10';
                document.getElementById('workMinutes').value =
                    (settings.workMinutes !== undefined && settings.workMinutes !== '') ? settings.workMinutes : '0';
            } catch (e) {
                console.error("Failed to parse settings", e);
            }
        }
        applyPlatformUI();
    }

    /* ---------------- Platform ---------------- */

    function switchPlatform(platform) {
        currentPlatform = platform;
        applyPlatformUI();
        saveAndCalculate();
    }

    function applyPlatformUI() {
        const isUpwork = currentPlatform === 'upwork';

        document.getElementById('upworkTab').className = `tab-btn ${isUpwork ? 'active upwork' : ''}`;
        document.getElementById('fiverrTab').className = `tab-btn ${!isUpwork ? 'active fiverr' : ''}`;

        const brandColor = isUpwork ? 'var(--primary-upwork)' : 'var(--primary-fiverr)';

        document.getElementById('copyBtn').style.background = brandColor;
        document.getElementById('earningsHeader').style.color = brandColor;
        document.getElementById('takeHomeCard').style.borderColor =
            isUpwork ? 'rgba(20, 168, 0, 0.4)' : 'rgba(29, 191, 115, 0.4)';

        if (!isUpwork) {
            document.getElementById('modeToggle').checked = false;
        } else {
            document.getElementById('modeToggle').checked = platformModes['upwork'];
        }

        refreshSidebarState();
    }

    /* ---------------- Sidebar state (single source of truth) ---------------- */

    function refreshSidebarState() {
        const isUpwork = currentPlatform === 'upwork';
        const isHourly = document.getElementById('jobTypeToggle').checked;
        const hoursMode = isUpwork && isHourly && !document.getElementById('basisToggle').checked;

        /* Job type toggle */
        document.getElementById('typeToggleBox').style.display = isUpwork ? 'flex' : 'none';
        document.getElementById('toggleLabelText').innerText = isHourly ? 'Hourly Job' : 'Fixed Job';

        /* Calculation basis toggle */
        document.getElementById('calcBasisToggleBox').style.display = (isUpwork && isHourly) ? 'flex' : 'none';

        const basisLabel = document.getElementById('basisLabelText');
        const basisHint = document.getElementById('basisHintText');
        if (hoursMode) {
            basisLabel.innerText = 'By Hours Worked';
            basisHint.innerText = '💡 Enter hours → get client total';
            basisHint.style.color = 'var(--accent-yellow)';
        } else {
            basisLabel.innerText = 'By Client Budget';
            basisHint.innerText = '💡 Enter budget → get hours';
            basisHint.style.color = 'var(--primary-fiverr)';
        }

        /* Hourly rate availability */
        setHourlyRateDisabled(!isHourly);

        /* Hours / minutes inputs */
        document.getElementById('hoursInputGroup').style.display = hoursMode ? 'flex' : 'none';
        document.getElementById('minutesInputGroup').style.display = hoursMode ? 'flex' : 'none';

        /* Budget field becomes a computed output in hours mode */
        setBudgetReadonly(hoursMode);
        document.getElementById('budgetLabel').innerText = hoursMode ? 'Client Total ($)' : 'Client Budget ($)';

        /* Fee mode toggle */
        const feeModeBox = document.getElementById('feeModeToggleBox');
        const modeToggle = document.getElementById('modeToggle');
        const modeLabel = document.getElementById('modeLabelText');
        const modeHint = document.getElementById('modeHintText');

        if (!isUpwork) {
            feeModeBox.classList.add('disabled-box');
            modeLabel.innerText = 'Standard Fee';
            modeHint.innerText = '💡 Client will pay fee (Default)';
            modeHint.style.color = 'var(--text-muted)';
        } else if (hoursMode) {
            feeModeBox.classList.add('disabled-box');
            modeLabel.innerText = 'Fee Added On Top';
            modeHint.innerText = '💡 Total = work cost + platform fees';
            modeHint.style.color = 'var(--accent-yellow)';
        } else {
            feeModeBox.classList.remove('disabled-box');
            if (modeToggle.checked) {
                modeLabel.innerText = 'Included Fee (Active)';
                modeHint.innerText = '💡 Client will not pay fee';
                modeHint.style.color = 'var(--primary-upwork)';
            } else {
                modeLabel.innerText = 'Excluded Fee (Active)';
                modeHint.innerText = '💡 Client will pay fee';
                modeHint.style.color = 'var(--accent-yellow)';
            }
        }
    }

    function setHourlyRateDisabled(isDisabled) {
        const rateInput = document.getElementById('hourlyRate');
        const rateGroup = document.getElementById('rateInputGroup');
        rateInput.disabled = isDisabled;

        if (isDisabled) {
            rateGroup.classList.add('disabled-group');
        } else {
            rateGroup.classList.remove('disabled-group');
        }
    }

    function setBudgetReadonly(isReadonly) {
        const budgetInput = document.getElementById('totalBudget');
        const budgetGroup = document.getElementById('budgetInputGroup');
        budgetInput.readOnly = isReadonly;

        if (isReadonly) {
            budgetGroup.classList.add('computed-group');
        } else {
            budgetGroup.classList.remove('computed-group');
        }
    }

    /* ---------------- Toggle handlers ---------------- */

    function triggerTypeToggle() {
        if (currentPlatform !== 'upwork') return;
        const toggle = document.getElementById('jobTypeToggle');
        toggle.checked = !toggle.checked;
        refreshSidebarState();
        saveAndCalculate();
    }

    function triggerBasisToggle() {
        if (currentPlatform !== 'upwork') return;
        if (!document.getElementById('jobTypeToggle').checked) return;
        const toggle = document.getElementById('basisToggle');
        toggle.checked = !toggle.checked;
        refreshSidebarState();
        saveAndCalculate();
    }

    function triggerModeToggle() {
        if (currentPlatform === 'fiverr') return;

        const isHourly = document.getElementById('jobTypeToggle').checked;
        const hoursMode = isHourly && !document.getElementById('basisToggle').checked;
        if (hoursMode) return; // disabled while calculating by hours

        const toggle = document.getElementById('modeToggle');
        toggle.checked = !toggle.checked;
        platformModes['upwork'] = toggle.checked;
        refreshSidebarState();
        saveAndCalculate();
    }

    /* ---------------- Calculation ---------------- */

    function saveAndCalculate() {
        saveSettings();
        performCalculation();
    }

    function performCalculation() {
        const isUpwork = currentPlatform === 'upwork';
        const isHourly = isUpwork && document.getElementById('jobTypeToggle').checked;
        const isHoursMode = isHourly && !document.getElementById('basisToggle').checked;
        const isIncluded = isUpwork && !isHoursMode && document.getElementById('modeToggle').checked;

        const rate = parseFloat(document.getElementById('hourlyRate').value) || 0;
        let budget = parseFloat(document.getElementById('totalBudget').value) || 0;

        let workCost = 0, clientFees = 0, oneTimeFee = 0, grandTotal = 0;
        let hours = 0, minutes = 0;
        const freelancerFeeRate = isUpwork ? 0.10 : 0.20;

        if (isUpwork) {
            oneTimeFee = 9.99;
            const hourlyFeeRate = 0.46;

            if (isHoursMode) {
                /* ---- By Hours Worked: rate + hours + minutes → client total ---- */
                const rawH = parseFloat(document.getElementById('workHours').value) || 0;
                const rawM = parseFloat(document.getElementById('workMinutes').value) || 0;

                const totalMinutes = Math.max(0, Math.round(rawH * 60 + rawM));
                hours = Math.floor(totalMinutes / 60);
                minutes = totalMinutes % 60;
                const decimalHours = totalMinutes / 60;

                workCost = decimalHours * rate;
                clientFees = decimalHours * hourlyFeeRate;
                grandTotal = workCost + clientFees + oneTimeFee;

                /* Push the computed total back into the (read-only) budget field */
                document.getElementById('totalBudget').value = grandTotal.toFixed(2);
                budget = grandTotal;

            } else if (isHourly) {
                const hourlyTotal = rate + hourlyFeeRate;

                if (isIncluded) {
                    const remainingBudget = Math.max(0, budget - oneTimeFee);
                    const decimalHours = hourlyTotal > 0 ? remainingBudget / hourlyTotal : 0;
                    hours = Math.floor(decimalHours);
                    minutes = Math.floor((decimalHours - hours) * 60);

                    workCost = (hours + minutes / 60) * rate;
                    clientFees = (hours + minutes / 60) * hourlyFeeRate;
                    grandTotal = workCost + clientFees + oneTimeFee;
                } else {
                    hours = rate > 0 ? Math.floor(budget / rate) : 0;
                    minutes = rate > 0 ? Math.floor(((budget / rate) - hours) * 60) : 0;
                    workCost = budget;
                    clientFees = (hours + minutes / 60) * hourlyFeeRate;
                    grandTotal = workCost + clientFees + oneTimeFee;
                }
            } else {
                if (isIncluded) {
                    workCost = Math.max(0, (budget - oneTimeFee) / 1.05);
                    clientFees = workCost * 0.05;
                    grandTotal = budget;
                } else {
                    workCost = budget;
                    clientFees = workCost * 0.05;
                    grandTotal = workCost + clientFees + oneTimeFee;
                }
            }
        } else {
            oneTimeFee = 0;
            workCost = budget;
            clientFees = (workCost * 0.055) + 2.50;
            grandTotal = workCost + clientFees;
        }

        const freelancerFee = workCost * freelancerFeeRate;
        const netEarnings = workCost - freelancerFee;
        const totalFees = clientFees + oneTimeFee;  // Sum of platform fees + one-time fee

        /* ---------- Proposal Message (no greeting) ---------- */
        let msg = '';

        if (isHoursMode) {
            msg += `Here is the cost breakdown for ${hours}h ${minutes}m of work at $${rate}/hr:\n\n`;
            msg += `• Work Time: ${hours} Hours ${minutes} Minutes\n`;
            msg += `• Work Cost ($${rate}/hr): $${workCost.toFixed(2)}\n`;
            msg += `• Upwork Fees & Taxes: $${clientFees.toFixed(2)}\n`;
            msg += `• One-Time Contract Fee: $${oneTimeFee}\n`;
            msg += `• Total Estimated Checkout: $${grandTotal.toFixed(2)}\n\n`;
            msg += `Looking forward to starting!`;
        } else if (isHourly) {
            msg += `To keep your total expense strictly within $${budget}, here is the breakdown for ${hours}h ${minutes}m of work:\n\n`;
            msg += `• Work Time: ${hours} Hours and ${minutes} Minutes\n`;
            msg += `• Work Cost ($${rate}/hr): $${workCost.toFixed(2)}\n`;
            msg += `• Upwork Fees & Taxes: $${clientFees.toFixed(2)}\n`;
            msg += `• One-Time Contract Fee: $${oneTimeFee}\n`;
            msg += `• Total Estimated Checkout: $${grandTotal.toFixed(2)}\n\n`;
            msg += isIncluded
                ? `This keeps your final bill safely within $${budget}.`
                : `Your total payment will be $${grandTotal.toFixed(2)}.`;
        } else {
            msg += `To set up our project offer, here is the breakdown:\n\n`;
            msg += `• Project Offer Price: $${workCost.toFixed(2)}\n`;
            msg += `• Estimated Platform Fees: $${clientFees.toFixed(2)}\n`;
            if (oneTimeFee > 0) msg += `• One-Time Contract Fee: $${oneTimeFee}\n`;
            msg += `• Total Out-of-Pocket Expense: $${grandTotal.toFixed(2)}\n\n`;
            msg += `Looking forward to starting!`;
        }

        document.getElementById('clientMessageArea').value = msg;

        /* ---------- Client UI Output ---------- */
        let clientHTML = '';
        if (isHourly) {
            clientHTML += `<div class="breakdown-item"><span>Total Duration:</span> <strong>${hours}h ${minutes}m</strong></div>`;
        }
        
        // Base Work Cost with blue highlight
        clientHTML += `<div class="breakdown-item workcost-highlight"><span>Base Work Cost:</span> <strong>$${workCost.toFixed(2)}</strong></div>`;
        
        clientHTML += `<div class="breakdown-item"><span>Platform Fees:</span> <strong style="color: var(--accent-yellow);">$${clientFees.toFixed(2)}</strong></div>`;
        
        if (oneTimeFee > 0) {
            clientHTML += `<div class="breakdown-item"><span>One-Time Fee:</span> <strong>$${oneTimeFee.toFixed(2)}</strong></div>`;
        }
        
        // Combined total of platform fees + one-time fee with yellow highlight
        clientHTML += `<div class="breakdown-item fees-highlight"><span>Total Fees (Platform + One-Time):</span> <strong style="color: var(--accent-yellow);">$${totalFees.toFixed(2)}</strong></div>`;
        
        // Final total with white highlight
        clientHTML += `<div class="breakdown-item highlight"><span>Client Total:</span> <strong>$${grandTotal.toFixed(2)}</strong></div>`;
        
        document.getElementById('clientBreakdownList').innerHTML = clientHTML;

        /* ---------- Freelancer UI Output ---------- */
        let freeHTML = '';
        freeHTML += `<div class="breakdown-item"><span>Gross Earnings:</span> <strong>$${workCost.toFixed(2)}</strong></div>`;
        freeHTML += `<div class="breakdown-item"><span>Service Fee (${freelancerFeeRate * 100}%):</span> <strong style="color: var(--accent-yellow);">-$${freelancerFee.toFixed(2)}</strong></div>`;
        freeHTML += `<div class="breakdown-item highlight"><span>Your Take-Home:</span> <strong style="color:${isUpwork ? 'var(--primary-upwork)' : 'var(--primary-fiverr)'};">$${netEarnings.toFixed(2)}</strong></div>`;
        document.getElementById('freelancerBreakdownList').innerHTML = freeHTML;
    }

    function copyClientMessage() {
        const textarea = document.getElementById('clientMessageArea');
        textarea.select();
        navigator.clipboard.writeText(textarea.value);

        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 2500);
    }

    window.onload = () => {
        loadSettings();
        performCalculation();
    };
</script>
